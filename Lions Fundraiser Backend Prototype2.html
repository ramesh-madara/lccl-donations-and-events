<html lang="en"><head><meta http-equiv="Content-Type" content="text/html; charset=UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Lions Fundraiser Backend Prototype</title>

<style>
* { box-sizing: border-box; }

body {
    margin: 0;
    background: #f4f5f7;
    color: #333;
    font-family: Arial, Helvetica, sans-serif;
}

header {
    background: #252525;
    color: #fff;
    padding: 16px 25px;
}

header strong {
    color: #f7c600;
    font-size: 20px;
}

.wrap {
    max-width: 1450px;
    margin: auto;
    padding: 25px;
}

.dashboard {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 15px;
    margin-bottom: 25px;
}

.stat {
    background: #fff;
    border: 1px solid #e5e5e5;
    padding: 20px;
}

.stat small {
    color: #777;
}

.stat strong {
    display: block;
    font-size: 27px;
    margin-top: 8px;
}

.nav {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    flex-wrap: wrap;
}

.nav a {
    background: #fff;
    border: 1px solid #ddd;
    padding: 11px 16px;
    color: #333;
    text-decoration: none;
}

.nav a.active {
    background: #f7c600;
    border-color: #f7c600;
}

.grid {
    display: grid;
    grid-template-columns: 340px 1fr;
    gap: 20px;
}

.card {
    background: #fff;
    border: 1px solid #ddd;
    padding: 22px;
    margin-bottom: 20px;
}

.card h2 {
    margin: 0 0 18px;
    font-size: 20px;
    font-weight: 500;
}

.card h3 {
    margin: 20px 0 12px;
    font-size: 15px;
    text-transform: uppercase;
}

label {
    display: block;
    margin-bottom: 6px;
    font-size: 13px;
    font-weight: bold;
}

input,
select,
textarea {
    width: 100%;
    border: 1px solid #ccc;
    background: #fff;
    padding: 10px;
    margin-bottom: 13px;
    font-size: 14px;
}

textarea {
    min-height: 80px;
    resize: vertical;
}

button,
.btn {
    border: 0;
    background: #f7c600;
    color: #222;
    padding: 10px 14px;
    cursor: pointer;
    text-decoration: none;
    display: inline-block;
    font-size: 13px;
}

.btn.dark {
    background: #333;
    color: #fff;
}

.btn.light {
    background: #eee;
}

.btn.red {
    background: #d9534f;
    color: #fff;
}

.event-list a {
    display: block;
    border: 1px solid #e4e4e4;
    padding: 13px;
    margin-bottom: 8px;
    text-decoration: none;
    color: #333;
}

.event-list a.selected {
    border-left: 4px solid #f7c600;
    background: #fff9df;
}

.event-list small {
    display: block;
    color: #777;
    margin-top: 5px;
}

.badge {
    display: inline-block;
    padding: 4px 8px;
    font-size: 11px;
    background: #eee;
    text-transform: uppercase;
}

.badge.upcoming {
    background: #e6f0ff;
    color: #245a9a;
}

.badge.ongoing {
    background: #e7f7e9;
    color: #28723a;
}

.badge.completed {
    background: #eee;
    color: #666;
}

.badge.draft {
    background: #fff4d1;
    color: #866900;
}

.badge.booked {
    background: #eee;
    color: #666;
}

.badge.available {
    background: #e7f7e9;
    color: #28723a;
}

.flash {
    padding: 13px 16px;
    margin-bottom: 20px;
    background: #e7f7e9;
    border-left: 4px solid #37a34a;
}

.flash.error {
    background: #fdeaea;
    border-left-color: #d9534f;
}

.info {
    padding: 13px;
    background: #fff9df;
    border-left: 4px solid #f7c600;
    margin-bottom: 18px;
    line-height: 1.5;
}

.form-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px 18px;
}

.full {
    grid-column: 1 / -1;
}

.table-wrap {
    overflow-x: auto;
}

table {
    width: 100%;
    border-collapse: collapse;
    font-size: 13px;
}

th,
td {
    padding: 11px 9px;
    border-bottom: 1px solid #eee;
    text-align: left;
    vertical-align: middle;
}

th {
    background: #f7f7f7;
}

.actions {
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
}

.progress {
    background: #eee;
    height: 12px;
    overflow: hidden;
    margin-top: 8px;
}

.progress span {
    display: block;
    height: 100%;
    background: #f7c600;
}

.map {
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: 7px;
}

.map-seat {
    border-radius: 50%;
    padding: 8px 2px;
    background: #72a8e8;
    text-align: center;
    font-size: 10px;
}

.map-seat.booked {
    background: #aaa;
    color: #fff;
}

.legend {
    display: flex;
    gap: 18px;
    margin-top: 15px;
    font-size: 12px;
}

.legend span::before {
    content: "";
    display: inline-block;
    width: 10px;
    height: 10px;
    border-radius: 50%;
    background: #72a8e8;
    margin-right: 5px;
}

.legend .booked::before {
    background: #aaa;
}

@media (max-width: 1000px) {
    .grid {
        grid-template-columns: 1fr;
    }

    .dashboard {
        grid-template-columns: repeat(2,1fr);
    }
}

@media (max-width: 600px) {
    .dashboard,
    .form-grid {
        grid-template-columns: 1fr;
    }
}
</style>
</head>
