name: Deploy Plugin to cPanel

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install SSH Key
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Deploy via Rsync
        run: |
          rsync -avz -e "ssh -o StrictHostKeyChecking=no" --delete --exclude='.git/' --exclude='.github/' ./ ${{ secrets.SSH_USER }}@${{ secrets.SERVER_HOST }}:/home/lccl/public_html/wp-content/plugins/lccl-donations-and-events/